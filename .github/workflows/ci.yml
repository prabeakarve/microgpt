name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
      - name: Run the test suite (includes the finite-difference gradient check)
        run: python -m unittest discover -s tests -v
      - name: Smoke-train for 20 steps
        run: |
          python -m microgpt train \
            --corpus examples/corpus.txt --out /tmp/ci.npz \
            --block-size 32 --n-layer 1 --n-head 2 --n-embd 32 \
            --batch-size 4 --steps 20 --warmup 5 --eval-every 10
      - name: Smoke-sample from the checkpoint
        run: python -m microgpt sample --ckpt /tmp/ci.npz --tokens 20
