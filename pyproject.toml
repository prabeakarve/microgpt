[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microgpt-numpy"
version = "1.0.0"
description = "A GPT language model implemented from scratch in pure NumPy, with a hand-written backward pass."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "prabeakarve" }]
keywords = ["gpt", "transformer", "language-model", "numpy", "from-scratch", "deep-learning"]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/prabeakarve/microgpt"
Issues = "https://github.com/prabeakarve/microgpt/issues"

[project.scripts]
microgpt = "microgpt.__main__:main"

[tool.setuptools]
packages = ["microgpt"]
